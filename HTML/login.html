<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
    
</head>
<body>
    <div id="login-container" class="reg-contain">
        <h1>Login</h1>

        <div id="login-form-container" class="form-contain">
        <form id="login-form" action="">
           

            <div class="form-input">
            <label for="username">Username</label>
            <input type="text" id="login-username" required placeholder="Enter username">
            </div>

            <div class="form-input">
            <label for="password">Password</label>
            <input type="password" id="login-password" required placeholder="Enter password">
            </div>

            
            <button id="login-btn" type="submit">Login</button>
        </form>

        </div>

        <p id="login-message" class="status-msg">New User? <a href="./index.html">Register</a></p>

       
    </div>
    <script src="../JS/login_script.js"></script>
</body>
</html>
